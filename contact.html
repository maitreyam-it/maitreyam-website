<body>
  <header>
    <div class="header-container">
      <img src="images/logo.png" alt="Company Logo" class="logo">

    <nav>
      <a href="index.html">Home</a>

  <main>
    <h2>Get in Touch</h2>
    <p>Email: info.maitreyam@gmail.com</p>
    <p>Phone: +91-9665303369</p>
    <p>Location: Pune, Maharashtra, India</p>

    <h2>Send us a Message</h2>
		<form action="https://formsubmit.co/info.maitreyam@gmail.com" method="POST">
		<label for="name">Name:</label><br>
		<input type="text" id="name" name="name" required><br><br>
		
		<label for="contact">Contact Number:</label><br>
		<input type="text" id="contact" name="contact" required><br><br>
		
		<label for="email">Email:</label><br>
		<input type="email" id="email" name="email" required><br><br>
		
		<label for="message">Message:</label><br>
		<textarea id="message" name="message" rows="5" required></textarea><br><br>
		
		<!-- Prevent spam -->
		<input type="hidden" name="_captcha" value="false">
		<!-- Redirect back to your contact page after success -->
		<input type="hidden" name="_next" value="https://maitreyam.com/contact.html">
		
		<!-- ✅ Submit button -->
		<button type="submit">Send Message</button>
		</form>

  </main>
